- name: even or odd
  hosts: local
  connection: local
  vars:
   number: 7
  tasks:
   - name: is even
     debug:
       msg: "given number is {{ number }} is even"
     when:   number % 2 == 0 
   - name: is odd
     debug:
      msg: "given number is {{ number }} is odd"
     when:   number % 2 != 0 # when will execute first under tasks not name, there will be no else statements here
