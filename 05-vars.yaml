- name: demo on task level variables
  hosts: localhost
  connection: localhost # it will not ask for username ans password
  vars:
    COURSE: "Ansible"
    Trainer: "Siva"
    Duration: "150 hrs"
  tasks:
  - name: print information
    vars:
      COURSE: "DevSecops with AIOps"  
    debug: #inorder to print something debug is used
      msg: " I'am learning {{COURSE}}, Trainer is {{Trainer}}, Duration is {{Duration}}"
     